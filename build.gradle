plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base { archivesName = "${mod_id}-neoforge" }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'build/generated/sharedJava']
        }
        resources {
            srcDirs = ['../minecart-chain/src/main/resources', 'src/main/resources', 'build/generated/sources/modMetadata']
            exclude 'fabric.mod.json'
        }
    }
}

def syncSharedJava = tasks.register('syncSharedJava', Sync) {
    from('../minecart-chain/src/main/java') {
        exclude 'com/piotrek/minecartchain/MinecartChainMod.java'
    }
    from('../minecart-chain/src/client/java') {
        exclude 'com/piotrek/minecartchain/client/MinecartChainClient.java'
    }
    into 'build/generated/sharedJava'
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties([
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ])
    expand(inputs.properties)
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

neoForge.ideSyncTask generateModMetadata
tasks.named('processResources').configure { dependsOn generateModMetadata }
tasks.named('compileJava').configure { dependsOn syncSharedJava }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
